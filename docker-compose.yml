version: "3.8"

services:
  # ============================================================
  # LiveKit SFU — WebRTC 流媒体服务器
  # 所有会议的信令 + 媒体都经过 LiveKit 处理
  # ============================================================
  livekit-sfu:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    ports:
      - "7880:7880"   # WebSocket 信令
      - "7881:7881/udp" # WebRTC UDP 媒体
      - "7882:7882"   # TURN TCP 回退
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml
    healthcheck:
      test: ["CMD", "livekit-cli", "health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ============================================================
  # Rust Agent — LiveKit 信令透传代理
  # 浏览器 → Gateway → Agent → LiveKit SFU
  # ============================================================
  agent-conference:
    build:
      context: ../utils-support-parent-starter/utils-support-protocol-parent/utils-support-rust-agent-starter/rust
      dockerfile: docker/agent-conference.Dockerfile
    restart: unless-stopped
    command: [
      "--gateway-host", "gateway",
      "--gateway-port", "9001",
      "--agent-id", "agent-conference",
      "--agent-secret", "test-secret-123",
      "--livekit-url", "ws://livekit-sfu:7880",
    ]
    environment:
      - RUST_LOG=info
    depends_on:
      livekit-sfu:
        condition: service_healthy

  # ============================================================
  # Java Gateway — WS 入口 + Agent 路由 + 透明转发
  # ============================================================
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8082:8082"   # WS 浏览器入口 (路径路由: /remote-control, /livekit)
      - "9001:9001"   # Agent TCP 注册端口
    environment:
      - TCP_AGENT_PORT=9001
      - DWS_REMOTE_CONTROL_PORT=8082
      - GATEWAY_LIVEKIT_AGENT_RELAY_HOST=agent-conference
      - GATEWAY_LIVEKIT_AGENT_RELAY_PORT=9090
      - GATEWAY_LIVEKIT_SFU_URL=ws://livekit-sfu:7880
    depends_on:
      - agent-conference
