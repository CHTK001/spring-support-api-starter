# 采集模块编译门禁（collect-scheduler-starter 消费 parent 仓库的 spring-support-collect-starter）
#
# 覆盖范围：采集后端与调度端两个模块，以及它们在**本仓内**的依赖链。
# 本仓此前没有任何 CI；这条流水线的作用是把「本地 mvn 门禁」变成「提交必过」。
#
# 门禁内容（2026-10-01 本地验证）：
#   mvn -B test-compile -pl <两个采集模块> -am   →  BUILD SUCCESS，reactor 8 个模块
#
# ⚠️ 已知阻塞：干净环境下这一步**跑不通**，原因是跨仓依赖未发布。
#   采集模块依赖约 13 个兄弟模块（com.chua:utils-support-*、com.chua:spring-support-*），
#   它们在另外两个仓（utils-support-parent-starter / spring-support-parent-starter）里，
#   本仓 reactor 内没有。公网镜像上实测取不到：
#       https://maven.aliyun.com/repository/public
#         → 404  com/chua/utils-support-common-starter/4.0.0.42/…-4.0.0.42.pom
#         → 404  com/chua/spring-support-datasource-starter/4.0.0.42/…-4.0.0.42.pom
#   本地之所以能过，是因为本机 D:\maven-repo 里已经 install 过这些产物。
#   → 要让这条流水线真正为绿，二选一（需要仓库所有者决定，我没有擅自选）：
#     A. 把兄弟仓的产物发布到一个 CI 可访问的仓库（本文件末尾有示例步骤，默认注释掉）；
#     B. 让 CI 额外 checkout 兄弟仓并先 install 需要的模块（更重，utils 仓有 200+ 模块）。
#   在其中之一落地之前，这条流水线的编译步骤**预期是红的** —— 这是事实，不是配置错误。
#
# 刻意**不做**的事：
#   - 不加 paths 白名单（AGENTS.md 坑②：白名单漏掉「CI 自己会执行的文件」= 静默绕过门禁）。
#   - 不跑 `-DskipTests=false` 的测试：这两个模块目前**没有 src/test**（实测确认），
#     加了也只是空跑；将来补了测试再把参数打开（注意本仓根 pom 没有 skipTests 属性，
#     与 utils 仓不同，这里不需要显式覆盖）。
name: Collect API Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: collect-api-gate-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

# Only the deployable carrier still lives in this reactor; the collect entity is in
# spring-support-parent-starter and must be installed before the scheduler is built
# (see build-collect.mjs two-phase order).
env:
  COLLECT_MODULES: >-
    spring-api-support-collect-scheduler-starter

jobs:
  gate:
    name: Collect API Gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Show toolchain
        run: mvn -v

      # 方案 A 的位置（默认注释）。启用前请确认：兄弟仓在 GitHub 上的地址、需要的模块清单，
      # 以及这些产物是否会发布到 Actions 每次运行都能访问的仓库。
      #
      # 需要用表达式时，把下面整段取消注释即可（未注释的行里用表达式是安全的）。
      # - name: Fetch sibling artifacts (option A)
      #   env:
      #     UTILS_REPO_URL: <填 utils-support-parent-starter 的 clone 地址>
      #     SUPPORT_REPO_URL: <填 spring-support-parent-starter 的 clone 地址>
      #   run: |
      #     mkdir -p "$RUNNER_TEMP/siblings"
      #     git clone --depth 1 "$UTILS_REPO_URL" "$RUNNER_TEMP/siblings/utils"
      #     git clone --depth 1 "$SUPPORT_REPO_URL" "$RUNNER_TEMP/siblings/support"
      #     for r in utils support; do
      #       (cd "$RUNNER_TEMP/siblings/$r" && mvn -B -q install -DskipTests)
      #     done

      - name: Compile collect modules (+ in-repo dependencies)
        run: mvn -B test-compile -pl "${{ env.COLLECT_MODULES }}" -am

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collect-api-gate-log
          path: |
            **/target/*.log
          if-no-files-found: ignore
          retention-days: 7
