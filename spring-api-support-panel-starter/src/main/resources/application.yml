spring:
  application:
    name: panel
  profiles:
    active: dev
    include: appimage
  autoconfigure:
    exclude:
      - com.chua.starter.ai.support.configuration.AiConfiguration
      - com.chua.starter.ai.support.configuration.AiCacheKeyGeneratorAliasConfiguration
      - com.chua.starter.ai.support.configuration.AiCacheManagerFallbackConfiguration
      - com.chua.starter.ai.support.configuration.AiNewApiServerConfiguration
      - com.chua.starter.ai.support.configuration.RagAutoConfiguration

server:
  port: 58080

panel:
  enabled: true