# ===========================================
# 数据采集平台基础配置
# 数据库相关放在 profile：h2 为内置演示库，dev 为开发库
# ===========================================
spring:
  application:
    name: collect                             # 应用名称（数据采集平台）
  main:
    allow-circular-references: true           # 兼容既有 ServiceImpl 自注入模式
    allow-bean-definition-overriding: true    # 兼容多 starter 重复声明的同名 bean
  profiles:
    active: h2                                # 默认使用内置 H2，便于零依赖启动

# ===========================================
# 服务器配置
# ===========================================
server:
  port: 18190                                 # 服务端口
  servlet:
    context-path: /collect/api                # 上下文路径
  http2:
    enabled: true

# ===========================================
# MyBatis-Plus
# ===========================================
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml

# ===========================================
# 插件开关
# ===========================================
plugin:
  cors:
    enable: true
  log:
    enable: true
  mybatis:
    enable: true
  # 平台接口由控制台会话认证（见 plugin.collect.console），
  # 集成到统一网关时可改为 true 并去掉控制器上的 @Ignore。
  oauth:
    client:
      enable: false
  job:
    enable: true
    role: SINGLE                              # 单机闭环：自带 Leader 扫描与执行
  # 调度平台的接口面并入本进程：作业台账与采集流程共用同一张 sys_job。
  # 合并前端只用 /job-console/api/**（自带 @Ignore，采集控制台会话即可放行）；
  # /v1/job-platform/** 没有 @Ignore，仍需平台令牌，本宿主不提供。
  # 远程分发关闭——本节点就是执行器；它自带的 /job-console 页面壳与独立账号不再挂载。
  scheduler:
    job-platform:
      enabled: true
      remote-dispatch-enabled: false
  collect:
    enable: true
    console:
      auth-enabled: true                      # 关闭后接口对本网络开放
      username: admin
      password: admin123456                   # 部署时必须改掉
    script:
      enable: true                              # false 时脚本节点从设计器工具箱消失
    notify:
      enable: true                              # false 时不投递执行通知（配置仍可维护）
    function:
      enable: true                              # false 时自定义函数不参与解析，只剩内置函数
    process:
      enable: true                              # false 时子流程节点从设计器工具箱消失
      max-depth: 5                              # 子流程嵌套层数上限，超过后节点直接失败
