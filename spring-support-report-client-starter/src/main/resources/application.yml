# Spring Boot 应用配置
spring:
  application:
    name: report-client
  profiles:
    active: dev

# 服务器配置
server:
  port: 8080

# 设备数据上报客户端配置
plugin:
  report:
    client:
      # 启用设备数据上报
      enable: true
      
      # 监控服务器地址
      address: "http://localhost:19170"
      
      # 上报接口路径
      address-report-path: "/monitor/api"
      
      # 接收协议
      receivable-protocol: "http"
      
      # 接收端口 (-1表示使用server.port + 10000)
      receivable-port: -1
      
      # 推送间隔时间（秒）
      push-interval: 30
      
      # 初始延迟时间（秒）
      initial-delay: 10
      
      # 连接超时时间（毫秒）
      connect-timeout: 5000
      
      # 读取超时时间（毫秒）
      read-timeout: 10000
      
      # 重试次数
      retry-count: 3
      
      # 设备ID（可选，不配置则自动生成）
      device-id: ""
      
      # 设备名称（可选，不配置则使用主机名）
      device-name: ""
      
      # 文件管理配置
      file-management:
        # 启用文件管理功能
        enable: false
        
        # 文件操作根目录（所有文件操作都限制在此目录下）
        root-directory: ${user.home}
        
        # 允许的文件扩展名列表（空列表表示允许所有文件类型）
        allowed-extensions: []
        
        # 禁止的文件扩展名列表
        forbidden-extensions:
          - exe
          - bat
          - cmd
          - sh
          - ps1
          - vbs
          - jar
          - war
          - ear
        
        # 单个文件最大大小（字节，默认100MB）
        max-file-size: 104857600
        
        # 单次上传最大文件数量
        max-file-count: 10
        
        # 是否允许创建目录
        allow-create-directory: true
        
        # 是否允许删除文件
        allow-delete-file: true
        
        # 是否允许删除目录
        allow-delete-directory: false
        
        # 是否允许重命名文件
        allow-rename-file: true
        
        # 是否允许移动文件
        allow-move-file: true
        
        # 是否允许修改文件权限
        allow-change-permissions: false
        
        # 预览文件最大大小（字节，默认1MB）
        max-preview-size: 1048576
        
        # 预览文件支持的编码列表
        preview-encodings:
          - UTF-8
          - GBK
          - GB2312
          - ISO-8859-1
        
        # 文件树最大深度
        max-tree-depth: 10
        
        # 是否显示隐藏文件
        show-hidden-files: false
        
        # 临时文件目录
        temp-directory: ${java.io.tmpdir}
        
        # 文件操作超时时间（毫秒）
        operation-timeout: 30000
        
        # 是否启用文件操作日志
        enable-operation-log: true
        
        # 健康检查有效期（秒）
        # 客户端健康状态的有效期，超过此时间文件管理接口将不可用
        health-validity-period: 300

# 日志配置
logging:
  level:
    com.chua.report.client.starter: INFO
    com.chua.oshi.support: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
