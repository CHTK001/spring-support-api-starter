server:
  port: 18170
  servlet:
    context-path: /admin/api
spring:
  datasource:
    driverClassName: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:postgresql://127.0.0.1:5432/system
    username: postgres
    password: root
  redis:
    database: 6
    host: 127.0.0.1
    port: 6379
  sql:
    init:
      continue-on-error: true
      #      data-locations: classpath*:sql/*.sql
      mode: always

logging:
  level:
    com.chua.starter.admin.support.mapper: debug

