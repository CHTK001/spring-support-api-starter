server:
  port: 18170
  servlet:
    context-path: /admin/api
spring:
  datasource:
    driverClassName: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:mysql://172.16.2.226:3306/system?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&autoReconnect=true&allowMultiQueries=true
    username: root
    password: root
  redis:
    database: 6
    host: 172.16.2.226
    port: 6379
  sql:
    init:
      continue-on-error: true
#      data-locations: classpath*:sql/*.sql
      mode: always
management:
  endpoints:
    web:
      exposure:
        include: '*'
logging:
  level:
    com.chua.starter.admin.support.mapper: debug


plugin:
  socket:
    open: true
  table:
    packages: com.chua.starter.admin.entity
    enable: true
  oauth:
    address: http://172.16.2.226:19180/oauth
  swagger:
    knife4j:
      - group-name: 系统配置
        base-package: com.chua.starter.admin
