spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/system_h2;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  h2:
    console:
      enabled: true
  sql:
    init:
      mode: never
plugin:
  datasource:
    script:
      enable: true
      scan-mode: ONCE
      data-scan-mode: ONCE
      migration-scan-mode: ALWAYS
      continue-on-error: true
      verbose: true
  redis:
    server:
      enable: false
  job:
    enable: false
  sync:
    client:
      enable: false
  user-agreement:
    enable: false
  system:
    feedback:
      menu:
        enabled: false
