spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/system_h2;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  h2:
    console:
      enabled: true
  sql:
    init:
      mode: never
plugin:
  datasource:
    script:
      enable: true
      scan-mode: ONCE
      data-scan-mode: ONCE
      migration-scan-mode: ALWAYS
      continue-on-error: true
      verbose: true
  redis:
    server:
      enable: false
  job:
    enable: false
  sync:
    # 单机本地库不需要跨服务同步通道，两端都关掉避免无谓的注册与报错
    server:
      enable: false
    client:
      enable: false
  oauth:
    # 登录页在拿到令牌之前就要读取品牌与验证方式开关，只放行这一个只读分组
    whitelist:
      - /v2/setting/default
    server:
      # H2 本地开发环境：随机生成的密钥，非生产用途
      service-key: mi5yws8p7brq6gztlxofnkae
      sign-verify: true
      jwt:
        enabled: true
        algorithm: HS256
        secret: rbpa18zwjv5e3tsg2iymqu0lx4cdf7khon96
        issuer: oauth-server
        expire-seconds: 3600
  user-agreement:
    enable: false
  system:
    feedback:
      menu:
        enabled: false
