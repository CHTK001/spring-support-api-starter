spring:
  application:
    name: system
  profiles:
    active: dev
    include: plugin,mybatis,swagger,api,ip,actuator

server:
  port: 18170
  servlet:
    context-path: /system/api

# ===========================================
# 插件启用配置
# ===========================================
plugin:
  log:
    enable: true
  captcha:
    enable: true
  optional:
    enable: true
  mybatis:
    enable: true
  redis:
    server:
      enable: true
  oauth:
    client:
      enable: true
    temp:
      open: true
  api:
    uniform: true
    version:
      enable: true
    spi:
      enable: true
    deprecated:
      enable: true
