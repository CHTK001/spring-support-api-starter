# ===========================================
# 应用程序基础配置
# ===========================================
spring:
  main:
    allow-circular-references: true          # 允许循环引用（历史遗留的 ServiceImpl 自注入模式）
    allow-bean-definition-overriding: true   # 允许 bean 定义覆盖
  autoconfigure:
    exclude: []
  servlet:
    multipart:
      # 容器层上限必须 >= plugin.filesystem.upload.max-size-mb，否则分片在进入控制器前就被拒
      max-file-size: 10MB
      max-request-size: 12MB
  application:
    name: system                            # 应用名称（系统服务）
  profiles:
    active: dev
    group:
      dev-static:
        - dev
    include: common,mybatis,swagger,api,ip,actuator  # 引入的公共配置模块

# ===========================================
# 服务器配置
# ===========================================
server:
  port: 18170                               # 系统服务端口
  servlet:
    context-path: /system/api               # 上下文路径

# ===========================================
# Actuator 配置
# ===========================================
management:
  endpoints:
    web:
      exposure:
        exclude: mybatis-extension

plugin:
  # ===========================================
  # 文件存储（独立模块 spring-support-filesystem-starter 作为唯一底座）
  # ===========================================
  filesystem:
    enable: true
    # 未指定提供者时落到该提供者
    default-provider: local
    providers:
      local:
        type: local
        bucket: system
        base-path: ./oss
    upload:
      # 回显走本应用的 /v2/file/view/**，需带上上下文路径
      view-prefix: /system/api/v2/file/view/
      temp-dir: ./oss/.chunks
    # 文件服务器（独立文件存储网关）：随应用自动启动，供"文件服务器"页面直连
    storage-server:
      enable: true
      host: 0.0.0.0
      port: 18080
      # 对外可达地址（/v2/setting/default 下发的 other.filestorage.server）；留空回退 host
      public-host: 127.0.0.1
      # 私有桶（provider 名，逗号分隔；* 表示全部私有）。留空回退 plugin.oauth.file-storage.private-buckets；
      # 运行期可在文件服务器页「系统配置」热更新，无需重启
      private-buckets: ""
      # 跨域（CORS）：文件服务器是独立端口网关，前端页面基本都跨源访问，故默认开启。
      # 由框架 CorsFilter 统一生效（其 order 最小、最先执行），过滤器侧不再重复设置。
      cors:
        enable: true
        # 允许携带凭据（Cookie / Authorization）。预览页以 credentials:'include' 发起跨域 fetch，
        # 缺 Access-Control-Allow-Credentials 会让浏览器拦掉整个响应。
        # 开启后即使 allowed-origins 为 * 也不会字面返回通配符，而是回显实际请求来源
        # ——规范禁止「凭据 + 通配来源」并用。
        allow-credentials: true
        # 允许的来源，逗号分隔；* 表示任意来源
        allowed-origins: "*"
        # 允许的请求头，逗号分隔。
        # 必须与前端实际发出的自定义头一致：
        # ① 前端 axios 拦截器的第一方头 X-Trace-Id、X-Requested-With（见
        #    packages/utils/src/http.ts）；② 加密管线的 X-Req-Fingerprint；
        # ③ 文件服务器的**默认令牌入口** x-oauth-token —— 服务端解析顺序为
        #    「自定义头 → Authorization Bearer → 查询参数 → Cookie」，
        #    storageHttp() 与 putObject() 都会带这个头，跨域下它同样进预检。
        # 预检时浏览器逐个比对 Access-Control-Request-Headers，缺一个即整条预检失败，
        # 业务请求根本发不出去（控制台报 xxx is not allowed by Access-Control-Allow-Headers）。
        #
        # 注意：本文件的具体值**覆盖** FileStorageServerProperties.Cors 的类默认值，
        # 改类默认值不会生效——踩过这个坑，排查了两轮。
        allowed-headers: "Content-Type,Authorization,x-oauth-token,X-Requested-With,X-Trace-Id,X-Req-Fingerprint"
        # 跨域下自定义响应头默认不可读，需显式暴露：
        # Content-Disposition（前端读文件名）与预览通道标识（前端据此选渲染器）
        expose-headers: "Content-Disposition,Content-Range,Accept-Ranges,X-FileStorage-Preview,X-FileStorage-Client-Renderer,X-FileStorage-Convert,X-FileStorage-ImageOp,X-FileStorage-ImageOp-Reason"
        allowed-methods: "GET,HEAD,POST,PUT,DELETE,PATCH,OPTIONS"
  mybatis:
    data:
      scope:
        enable: true
  # ===========================================
  # 三方登录「系统回调地址」白名单（开放重定向防护）
  # callback 参数为绝对地址时，其 scheme://host[:port] 前缀必须命中本列表，
  # 否则回调重定向被拒绝；默认空 = fail-closed（绝对地址一律拒绝）。
  # 前端发送「绝对 origin + pathname」，故 dev/e2e/部署地址都必须列出。
  # 声明在基线 application.yml 而非 profile 专属文件：部署用
  # --spring.profiles.active=server 覆盖 profile，dev 配置不会被加载。
  # ===========================================
  system:
    security:
      allowed-system-callback-hosts:
        - http://localhost:8096
        - http://127.0.0.1:8096
        - http://192.168.50.198:8096
  oauth:
    # 登录页/整页刷新阶段的远程配置拉取不带 Bearer，必须匿名可达；该接口只回
    # default/sso/default-1 分组且敏感项已脱敏。只放行这一个路径，勿扩到 /v2/setting/**。
    # 声明在此而非 application-dev.yml：部署用 --spring.profiles.active=server 覆盖 profile，
    # dev 专属配置不会被加载。
    whitelist:
      - /v2/setting/default
      - /v2/sms/send
      - /v2/sms/login
      - /v2/email/send
      - /v2/email/login