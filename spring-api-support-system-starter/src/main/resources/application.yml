# ===========================================
# 应用程序基础配置
# ===========================================
spring:
  application:
    name: system                            # 应用名称（系统服务）
  profiles:
    active: dev                             # 默认激活本地联调环境，OAuth 走测试服务器
    group:
      dev-static:
        - dev
    include: common,mybatis,swagger,api,ip,actuator  # 引入的公共配置模块

# ===========================================
# 服务器配置
# ===========================================
server:
  port: 18170                               # 系统服务端口
  servlet:
    context-path: /system/api               # 上下文路径

# ===========================================
# Actuator 配置
# ===========================================
management:
  endpoints:
    web:
      exposure:
        exclude: mybatis-extension
