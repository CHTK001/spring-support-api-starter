# ===========================================
# API 统一配置
# ===========================================
plugin:
  api:
    # -----------------------------------------
    # 版本控制配置
    # -----------------------------------------
#    version:
#        enable: true
    # -----------------------------------------
    # 平台配置
    # -----------------------------------------
    platform:
      # 开启平台标识
      enable: true
      # 平台类型（枚举：SYSTEM/TENANT/MONITOR/SCHEDULER/OAUTH）
      # 优先级高于 alias-name
      name: SYSTEM
    # -----------------------------------------
    # 统一返回值配置
    # -----------------------------------------
    # 是否启用统一返回值包装
#    uniform: true

    # -----------------------------------------
    # SPI配置
    # -----------------------------------------
    spi:
      mapping:
        balance: com.chua.common.support.lang.robin.Robin
        serviceDiscovery: com.chua.common.support.discovery.ServiceDiscovery
    # -----------------------------------------
    # 响应编码配置
    # -----------------------------------------
    encode:
      # 开启响应编码功能
      enable: true

    # -----------------------------------------
    # 请求解码配置
    # -----------------------------------------
    decode:
      # 开启请求解码功能
      enable: true