# ===========================================
# 插件功能开关配置
# ===========================================
plugin:
  system:
    server:
      # 启用系统服务
      enable: true
      # 缓存配置
      cache:
        # 是否启用缓存
        enable: true
        # 缓存过期时间（秒）
        expire: 3600
      # 日志配置
      log:
        # 是否启用操作日志
        enable: true
        # 是否异步记录日志
        async: true

  # ===========================================
  # Nonce 签名默认配置（需与前端保持一致）
  # ===========================================
  nonce:
    sign:
      secret-key: aP9xL3sV7mQ2zT5kB8nR1cY4wH6eD0fJ       # 默认签名密钥，建议生产环境通过配置中心覆盖

