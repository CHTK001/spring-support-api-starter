# ===========================================
# 插件功能开关配置
# ===========================================
plugin:
  system:
    server:
      # 启用系统服务
      enable: true
      # 缓存配置
      cache:
        # 是否启用缓存
        enable: true
        # 缓存过期时间（秒）
        expire: 3600
      # 日志配置
      log:
        # 是否启用操作日志
        enable: true
        # 是否异步记录日志
        async: true

