spring:
  datasource:
    driverClassName: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:mysql://172.16.0.40:3306/system?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root@
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 60000
      max-lifetime: 300000
  data:
    redis:
      database: 6
      host: 172.16.0.40
      port: 16379
  sql:
    init:
      continue-on-error: true
      #      data-locations: classpath*:db/*.db
      mode: always
logging:
  level:
    com.chua.starter.system.mapper: debug


plugin:
  datasource:
    script:
      scan-mode: ONCE
  oauth:
    address: http://172.16.0.40:19180/oauth
    protocol: static
    auth-address: http://172.16.0.40:19180/oauth
    whitelist:
      - /v2/setting/default
      - /v2/setting/**
      - /captcha
      - /**/captcha
      - /**/users/loginCode
    rate-limit:
      enable: true
      api:
        enable: true
        qps: 200
        window-seconds: 1
      login:
        enable: true
        ip-limit: 30
        ip-window-seconds: 60
        account-fail-limit: 3
        account-lock-minutes: 5

soft:
  management:
    enable: false