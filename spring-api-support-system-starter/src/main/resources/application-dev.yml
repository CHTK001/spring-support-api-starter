spring:
  datasource:
    driverClassName: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:mysql://172.16.0.40:3306/system?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root@
  data:
    redis:
      database: 6
      host: 172.16.0.40
      port: 16379
  sql:
    init:
      continue-on-error: true
      #      data-locations: classpath*:db/*.db
      mode: always
logging:
  level:
    com.chua.starter.system.mapper: debug


plugin:
  oauth:
    address: http://172.16.0.40:19180
    enable-encryption: true
    login-page: /oauth/login
    logout-page: /oauth/logout
    oauth-url: /oauth/verify
    temporary-token-page: /oauth/temporary-token
    upgrade-page: /oauth/upgrade
    whitelist:
      - /**/refresh-token