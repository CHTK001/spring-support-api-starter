spring:
  datasource:
    driverClassName: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:mysql://localhost:3306/serverdb?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 60000
      max-lifetime: 300000
  data:
    redis:
      database: 6
      host: localhost
      port: 6379
      enabled: true
  sql:
    init:
      continue-on-error: true
      #      data-locations: classpath*:db/*.db
      mode: always
logging:
  level:
    com.chua.starter.system.mapper: debug


plugin:
  datasource:
    script:
      scan-mode: ONCE
  sync:
    # 同步模式: server-服务端（平台端下发租户数据）
    type: server
    server:
      enable: true
      protocol: websocket
      port: 19380
    # 租户同步消息传输加密密钥（租户端需保持一致）
    crypto-secret: demo-sync-secret-2026
  mybatis:
    data:
      scope:
        # 数据权限：按部门/本人过滤（sys_dept 表 + sys_dept_data_permission）
        enable: true
        table-name: sys_dept
        dept-id-column: sys_dept_id
        dept-tree-id-column: sys_dept_tree_id
        current-user-id-column: create_by
  system:
    server:
      enable: true
  oauth:
    address: http://localhost:19180/oauth
    protocol: http-lite
    auth-address: http://localhost:19180/oauth
    whitelist:
      - /v2/setting/default
      - /v2/setting/**
      - /captcha
      - /**/captcha
      - /**/users/loginCode
    rate-limit:
      enable: true
      api:
        enable: true
        qps: 200
        window-seconds: 1
      login:
        enable: true
        ip-limit: 30
        ip-window-seconds: 60
        account-fail-limit: 3
        account-lock-minutes: 5

soft:
  management:
    enable: false
