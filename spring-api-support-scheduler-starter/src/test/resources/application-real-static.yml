spring:
  autoconfigure:
    exclude:
      - com.chua.starter.system.configuration.SystemAutoConfiguration
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./target/real-run/scheduler-db;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:

server:
  port: 18083
  servlet:
    context-path: /scheduler/api

plugin:
  oauth:
    enable: false
    client:
      enable: false
  redis:
    server:
      enable: false
  job:
    enable: true
    auto-backup-cron: "0 0 3 * * ?"
    config-table-enabled: true
    table-init-mode: DROP_CREATE
  scheduler:
    job-platform:
      enabled: true
      remote-dispatch-enabled: true
      dispatch-interval-ms: 1000
      dispatch-batch-size: 20
      console:
        auth-enabled: false
      namespaces:
        payment:
          prefix: payment
          executor-mode: STATIC
          executors:
            - name: payment-node-1
              base-url: http://127.0.0.1:18081/payment/api
              access-token: job-secret
              dispatch-path: /v1/job-executor/dispatch
              connect-timeout-ms: 3000
              read-timeout-ms: 10000

logging:
  level:
    com.chua.starter.scheduler: INFO

mybatis-plus:
  mapper-locations: classpath*:mapper/job-platform-only/*.xml
