spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:scheduler_browser;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  h2:
    console:
      enabled: true

plugin:
  oauth:
    client:
      enable: false
  redis:
    server:
      enable: false
  job:
    table-init-mode: DROP_CREATE
  scheduler:
    job-platform:
      remote-dispatch-enabled: false
      console:
        auth-enabled: true
        username: admin
        password: admin123456

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.chua.starter.scheduler: DEBUG
