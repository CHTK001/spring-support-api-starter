# ===========================================
# 应用程序基础配置
# ===========================================
spring:
  application:
    name: scheduler                         # 应用名称（调度中心服务）
  profiles:
    active: dev                             # 当前激活的环境
    include: mybatis,swagger,socket,control,codec,api,ip,discovery,tenant  # 引入的公共配置模块

# ===========================================
# 服务器配置
# ===========================================
server:
  port: 18083                               # 服务端口
  servlet:
    context-path: /scheduler/api            # 调度接口上下文路径
  http2:
    enabled: true                           # 启用 HTTP/2 支持

# ===========================================
# 插件启用配置
# ===========================================
plugin:
  cors:
    enable: true
  log:
    enable: true
  captcha:
    enable: true
  optional:
    enable: true
  mybatis:
    enable: true
  redis:
    server:
      enable: true
  oauth:
    client:
      enable: true
    temp:
      open: true
  api:
    platform:
      name: SCHEDULER
    uniform: true
    version:
      enable: true
    spi:
      enable: true
    deprecated:
      enable: true
  job:
    enable: true
    config-table-enabled: true
    table-init-mode: UPDATE
  scheduler:
    job-platform:
      enabled: true
      remote-dispatch-enabled: true
      dispatch-interval-ms: 1000
      dispatch-batch-size: 200
      namespaces:
        default:
          job: sys_job
          log: sys_job_log
          log-detail: sys_job_log_detail
          log-backup: sys_job_log_backup
        payment:
          prefix: payment
          # executors:
          #   - name: payment-local
          #     base-url: http://127.0.0.1:18081/payment/api
          #     access-token: job-secret
