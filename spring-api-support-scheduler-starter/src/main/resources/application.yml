# ===========================================
# 应用程序基础配置
# ===========================================
spring:
  application:
    name: scheduler                         # 应用名称（调度中心服务）
  main:
    allow-circular-references: true         # 兼容 common-service-starter 既有循环依赖
  profiles:
    active: dev                             # 当前激活的环境
    include: mybatis,swagger,socket,control,codec,api,ip,discovery,tenant  # 引入的公共配置模块
  # 排除 spring-boot-webmvc-4.1.0 引入的 ErrorMvcAutoConfiguration,
  # 避免与 spring-boot-autoconfigure-3.5.9 的同名 bean 冲突 (BeanDefinitionOverrideException)
  autoconfigure:
    exclude:
      - org.springframework.boot.webmvc.autoconfigure.error.ErrorMvcAutoConfiguration

# ===========================================
# 服务器配置
# ===========================================
server:
  port: 18083                               # 服务端口
  servlet:
    context-path: /scheduler/api            # 调度接口上下文路径
  http2:
    enabled: true                           # 启用 HTTP/2 支持

# ===========================================
# 插件启用配置
# ===========================================
plugin:
  cors:
    enable: true
  log:
    enable: true
  captcha:
    enable: true
  optional:
    enable: true
  mybatis:
    enable: true
  redis:
    server:
      enable: true
  oauth:
    client:
      enable: true
    temp:
      open: true
  api:
    enable: true
    platform:
      name: SCHEDULER
    uniform: true
    version:
      enable: true
    spi:
      enable: true
    deprecated:
      enable: true
  job:
    enable: true
    role: SCHEDULER
    cluster:
      group: default
      scan-interval-ms: 1000
      pre-read-ms: 5000
      lease-seconds: 15
    sync:
      in-memory: false
      scheduler:
        listen-host: 0.0.0.0
        listen-port: 8081
  scheduler:
    job-platform:
      enabled: true
