spring:
  application:
    name: music-demo

server:
  port: 19171

plugin:
  captcha:
    enable: false
  optional:
    enable: false
  api:
    uniform: false
    encode:
      enable: false
    decode:
      enable: false

knife4j:
  enable: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.chua.starter.music: info

music:
  http:
    connect-timeout-millis: 8000
    read-timeout-millis: 12000
