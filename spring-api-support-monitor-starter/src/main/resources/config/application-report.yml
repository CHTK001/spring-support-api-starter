# ===========================================
# 同步数据接收服务端配置
# ===========================================
# 该模块作为数据接收服务端，接收来自 Hotspot Agent 的上报数据
# ===========================================

plugin:
  sync:
    type: server
    server:
      instances:
        # WebSocket 同步服务（支持双向通信）
        - port: 29170
          protocol: websocket-sync
        # RSocket 同步服务（支持双向通信，高性能）
        - port: 29171
          protocol: rsocket-sync
        # HTTP 同步服务（单向上报，无下发功能）
        - port: 29172
          protocol: http-sync
      enable: true
  report:
    server:
      job:
        enable: false