# ===========================================
# SPI扩展点映射配置
# ===========================================
plugin:
  spi:
    # 开启SPI虚拟映射
    enable: true
    # 虚拟映射配置（别名 -> 接口全限定名）
    mapping:
      # 负载均衡策略
      robin: com.chua.common.support.lang.robin.Robin
      # 服务发现
      serviceDiscovery: com.chua.common.support.discovery.ServiceDiscovery
      # 文件存储插件
      fileStoragePlugin: com.chua.common.support.image.filter.ImageFilter
      # 文件存储
      fileStorage: com.chua.common.support.oss.FileStorage
      # 图片处理器
      ImageSettingProcessor: com.chua.common.support.protocol.filter.storage.image.ImageSettingProcessor
