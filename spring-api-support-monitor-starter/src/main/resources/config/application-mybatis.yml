# ===========================================
# MyBatis-Plus配置
# ===========================================
mybatis-plus:
  global-config:
    db-config:
      # 主键ID类型（auto/none/input/assign_id/assign_uuid）
      id-type: none
      # 逻辑删除-删除值
      logic-delete-value: 1
      # 逻辑删除-未删除值
      logic-not-delete-value: 0
  configuration:
    # 枚举类型处理器
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    # 驼峰下划线转换
    map-underscore-to-camel-case: true
    # SQL日志实现（开发测试时使用）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    # 开启二级缓存
    cache-enabled: true
  # 类型处理器包路径
  type-handlers-package: com.chua.starter.monitor.handler

# ===========================================
# 插件MyBatis扩展配置
# ===========================================
plugin:
  mybatis:
    # 开启XML热加载
    open-xml-reload: true
    # 只读模式（开启后禁止所有更新、插入、删除操作）
    read-only: false
    # 热加载方式（AUTO-自动刷新，NONE-不刷新）
    reload-type: AUTO
    # 热加载检测间隔（毫秒）
    reload-time: 3000
    # SQL方法加载源配置
    sql-method: []
    # 配置示例：
    # - type: FILE              # 来源类型（FILE/MYSQL）
    #   source: /path/to/sql    # 源信息
    #   timeout: 3000           # 超时时间（毫秒）
    #   watchdog: false         # 开启文件监控
