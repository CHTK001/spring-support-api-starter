# ===========================================
# Socket服务配置
# ===========================================
plugin:
  socket:
    # 开启Socket服务
    enable: true
    # 协议类型（socketio/rsocket）
    protocol: socketio
    # 监听地址
    host: 0.0.0.0
    # 房间配置列表
    room:
      # 默认房间
      - client-id: default
        context-path: /
        port: -1
        enable: true
      # WebRTC房间
      - client-id: webrtc
        context-path: /webrtc
        port: -2
        enable: true
      # Shell终端房间
      - client-id: shell
        context-path: /
        port: -3
        enable: true
