# ===========================================
# 插件功能开关配置
# ===========================================
plugin:
  mybatis:
    # 启用 MyBatis Plus 扩展（BaseMapper 通用方法等）
    enable: true

  monitor:
    server:
      # 启用监控服务
      enable: true
    spider:
      # 启用爬虫模块
      enabled: true
      web-auth:
        # 独立认证，避免依赖宿主系统登录态
        mode: embedded
        username: admin
        password: admin123
        session-timeout: 3600
      # 启动时自动补齐爬虫相关表结构
      auto-create-table: false
      # 页面预览请求超时（秒）
      request-timeout-seconds: 30
      # DOM 解析深度限制
      preview-max-depth: 10
      # 每层最多返回子节点数
      preview-max-children: 50
      # 文本预览最大长度
      preview-text-limit: 200
      ai:
        # 是否启用 Spider AI 分析
        enabled: true
        # 默认模型编码，为空时使用全局 llm 默认模型
        default-model: ""
        # 单次分析的最大 tokens
        max-tokens: 1800
        # 模型温度
        temperature: 0.2
        # 参与分析的 HTML 最大字符数
        max-html-chars: 12000
        # 参与分析的 DOM 节点摘要上限
        max-node-count: 40
        # 选择器命中摘要上限
        max-selector-matches: 8
