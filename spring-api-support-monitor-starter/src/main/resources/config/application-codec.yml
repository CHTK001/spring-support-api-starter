# ===========================================
# 编解码配置
# ===========================================
plugin:
  codec:
    # 开启加密功能
    enable: true
    # 是否由其它对象注入参数
    ext-inject: true
    # 开启响应加密
    response-enable: false
    # 开启请求解密
    request-enable: false
    # 请求加密密钥（为空则自动生成）
    codec-request-key:
    # 编解码器类型（sm2/aes/rsa等）
    codec-type: sm2
    # 加密白名单（不需要加密的接口路径）
    white-list: []
