spring:
  autoconfigure:
    exclude:
      - com.chua.starter.oauth.client.support.configuration.AuthClientConfiguration
      # profile 里的 exclude 是整体覆盖而非合并，故基础配置中的排除项要在此重复
      - com.chua.starter.oauth.sso.support.configuration.EnableAuthServerConfiguration
      - com.chua.starter.system.configuration.SystemAutoConfiguration
      - com.chua.starter.server.support.config.ServerManagementConfiguration
  datasource:
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:mysql://172.16.0.40:3306/report?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MONITOR_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 16
      minimum-idle: 4
      connection-timeout: 10000
  sql:
    init:
      enabled: false
      continue-on-error: true
      mode: always

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      connect-timeout: 3000
      timeout: 3000

plugin:
  datasource:
    script:
      enable: true
      scan-mode: ALWAYS
      validate-checksum: false
  redis:
    server:
      enable: false
  oauth:
    enable: false
  socket:
    enable: true

logging:
  level:
    com.chua.starter.monitor: debug
