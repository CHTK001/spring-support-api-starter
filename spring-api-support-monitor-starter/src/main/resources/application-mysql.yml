spring:
  datasource:
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:mysql://172.16.0.40:3306/report?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root@
    hikari:
      maximum-pool-size: 16
      minimum-idle: 4
      connection-timeout: 10000
  sql:
    init:
      enabled: false
      continue-on-error: true
      mode: always

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      connect-timeout: 3000
      timeout: 3000

plugin:
  datasource:
    script:
      enable: true
      scan-mode: ALWAYS
  redis:
    server:
      enable: false
  oauth:
    enable: false
  socket:
    enable: true

logging:
  level:
    com.chua.starter.monitor: debug
