# ===========================================
# 应用程序基础配置
# ===========================================
spring:
  application:
    # 应用名称
    name: monitor
  profiles:
    # 当前激活的配置文件
    active: dev
    # 包含的配置文件列表(dev放在最后确保数据源配置生效)
    include: plugin,mybatis,swagger,socket,api,ip,report,actuator
  main:
    # 允许Bean定义覆盖，解决Bean名称冲突问题
    allow-bean-definition-overriding: true

# ===========================================
# 服务器配置
# ===========================================
server:
  # 服务端口
  port: 19170
  servlet:
    # 上下文路径
    context-path: /monitor/api
