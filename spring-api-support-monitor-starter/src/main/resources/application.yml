spring:
  application:
    name: monitor
  profiles:
    active: dev
    include: mybatis,swagger,socket,control,codec,ip,discovery,options,report
  main:
    allow-bean-definition-overriding: true
plugin:
  parameter:
    enable: true
  cors:
    enable: true
server:
  port: 19170
  servlet:
    context-path: /monitor/api
  http2:
    enabled: true