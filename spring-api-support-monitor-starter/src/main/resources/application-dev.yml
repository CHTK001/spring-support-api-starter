spring:
  datasource:
    driverClassName: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:mysql://172.16.0.40:3306/report?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root@
  multi-datasource:
    hikari:
      data-source:
        - name: video
          driverClassName: com.p6spy.engine.spy.P6SpyDriver
          url: jdbc:p6spy:mysql://172.16.0.40:3306/video?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
          username: root
          password: root@
          max-lifetime: 1800000
          idle-timeout: 30000

  data:
    redis:
      database: 0
      host: 172.16.0.40
      port: 16379
  sql:
    init:
      continue-on-error: true
#      data-locations: classpath*:sql/*.sql
      mode: always
logging:
  level:
    com.chua.starter.admin.support.mapper: debug


plugin:
  oauth:
    address: http://172.16.3.66:19180/oauth
  api:
    ignore-format-packages:
      - com.chua.starter.monitor.jpom
      - com.chua.report.client.starter.jpom.common
  table:
    enable: true
    packages:
      - com.chua.starter.monitor.starter.entity
      - com.chua.starter.monitor.entity