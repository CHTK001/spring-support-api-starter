# ===========================================
# 开发环境配置
# ===========================================
spring:
  # -------------------------------------------
  # 数据源配置
  # -------------------------------------------
  datasource:
    # 数据库驱动类名（使用P6Spy进行SQL监控）
    driverClassName: com.p6spy.engine.spy.P6SpyDriver
    # 数据库连接URL
    url: jdbc:p6spy:mysql://172.16.0.40:3306/report?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    # 数据库用户名
    username: root
    # 数据库密码
    password: root@

  # -------------------------------------------
  # Redis配置
  # -------------------------------------------
  data:
    redis:
      # 数据库索引
      database: 0
      # Redis主机地址
      host: 172.16.0.40
      # Redis端口
      port: 16379
      # Redis密码（如需要）
      # password:
      # 连接超时时间
      # timeout: 10000

  # -------------------------------------------
  # SQL初始化配置
  # -------------------------------------------
  sql:
    init:
      # 初始化失败时继续执行
      continue-on-error: true
      # 数据脚本位置（如需要）
      # data-locations: classpath*:db/*.db
      # 初始化模式（always-总是执行，embedded-仅嵌入式数据库，never-从不）
      mode: always

# ===========================================
# 日志配置
# ===========================================
logging:
  level:
    # Mapper接口日志级别
    com.chua.starter.admin.support.mapper: debug

# ===========================================
# OAuth认证配置
# ===========================================
plugin:
  oauth:
    # 开启OAuth认证
    enable: true
    # 认证服务器地址
    address: http://172.16.3.66:19180/oauth
    # 认证协议（http/http-lite/static）
    protocol: static
    # 登录地址（可选）
    # login-address:
    # 加密方式（aes/rsa等）
    encryption: aes
    # 启用数据加密
    enable-encryption: true
    # Token名称
    token-name: x-oauth-token
    # Token别名
    alias: Boren-Token
    # 登录页路径
    login-page: /login
    # 登出页路径
    logout-page: /logout
    # OAuth接口路径
    oauth-url: /oauth
    # 负载均衡模式（polling/random/weight）
    balance: polling
    # 无权限页面路径
    no-permission-page: /oauth-page
    # 连接超时时间（毫秒）
    connect-timeout: 5000
    # 客户端缓存鉴权信息时间（秒）
    cache-timeout: 21600
    # 开启客户端缓存冷热备份
    cache-hot-cold-backup: true
    # 拦截地址
    block-address:
      - /*
    # 白名单列表（默认包含常用路径）
    # whitelist:
    #   - /**/captcha
    #   - /**/login
    # 密钥配置
    key:
      # 访问密钥ID
      access-key:
      # 访问密钥Secret
      secret-key:
    # 临时用户配置
    temp:
      # 开启临时用户
      open: false
      # 菜单路径
      menu-path:
      # 临时账号（格式：用户名:密码;用户名:密码）
      user: guest:guest
