# ===========================================
# 开发环境配置
# ===========================================
spring:
  autoconfigure:
    exclude:
      - com.chua.starter.oauth.client.support.configuration.AuthClientConfiguration
      # profile 里的 exclude 是整体覆盖而非合并，故基础配置中的排除项要在此重复
      - com.chua.starter.oauth.sso.support.configuration.EnableAuthServerConfiguration
      - com.chua.starter.system.configuration.SystemAutoConfiguration
  # -------------------------------------------
  # 数据源配置
  # -------------------------------------------
  datasource:
    # 数据库驱动类名（使用P6Spy进行SQL监控）
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    # 数据库连接URL
    url: jdbc:p6spy:mysql://172.16.0.40:3306/report?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    # 数据库用户名
    username: root
    # 数据库密码（不再写死 root@，需要时设 MONITOR_DB_PASSWORD）
    password: ${MONITOR_DB_PASSWORD:}
    # HikariCP连接池配置
    hikari:
      # 连接池名称
      pool-name: MonitorHikariPool
      # 最小空闲连接数
      minimum-idle: 5
      # 最大连接池大小
      maximum-pool-size: 20
      # 连接超时时间(毫秒)
      connection-timeout: 30000
      # 空闲连接超时时间(毫秒)
      idle-timeout: 600000
      # 连接最大生命周期(毫秒)
      max-lifetime: 1800000
      # 连接测试查询
      connection-test-query: SELECT 1

  # -------------------------------------------
  # Redis配置
  # -------------------------------------------
  data:
    redis:
      # 数据库索引
      database: 0
      # Redis主机地址
      host: localhost
      # Redis端口
      port: 6379

  # -------------------------------------------
  # SQL初始化配置
  # -------------------------------------------
  sql:
    init:
      # 初始化失败时继续执行
      continue-on-error: true
      # 数据脚本位置（如需要）
      # data-locations: classpath*:db/*.db
      # 初始化模式（always-总是执行，embedded-仅嵌入式数据库，never-从不）
      mode: always

# ===========================================
# 日志配置
# ===========================================
logging:
  level:
    # Mapper接口日志级别
    com.chua.starter.monitor.mapper: debug

# ===========================================
# OAuth认证配置
# ===========================================
plugin:
  datasource:
    script:
      # 每次启动都扫描并执行新的 INIT 脚本（从依赖 JAR 中发现新表）
      scan-mode: ALWAYS
  oauth:
    # 开启OAuth认证
    enable: false
    # 认证服务器地址
    address: http://localhost:19180/oauth
    # 认证协议（http/http-lite/static）
    protocol: http-lite

  socket:
    # 关闭 Socket.IO（测试 RAG 时不需要）
    enable: false

monitor:
  acme:
    # 关闭 ACME 证书自动续签（需要 Socket.IO）
    enabled: false
