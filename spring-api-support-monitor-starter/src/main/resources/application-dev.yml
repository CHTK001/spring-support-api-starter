# ===========================================
# 开发环境配置
# ===========================================
spring:
  # -------------------------------------------
  # 数据源配置
  # -------------------------------------------
  datasource:
    # 数据库驱动类名（使用P6Spy进行SQL监控）
    driverClassName: com.p6spy.engine.spy.P6SpyDriver
    # 数据库连接URL
    url: jdbc:p6spy:mysql://172.16.0.40:3306/report?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    # 数据库用户名
    username: root
    # 数据库密码
    password: root@

  # -------------------------------------------
  # Redis配置
  # -------------------------------------------
  data:
    redis:
      # 数据库索引
      database: 0
      # Redis主机地址
      host: 172.16.0.40
      # Redis端口
      port: 16379
      # Redis密码（如需要）
      # password:
      # 连接超时时间
      # timeout: 10000

  # -------------------------------------------
  # SQL初始化配置
  # -------------------------------------------
  sql:
    init:
      # 初始化失败时继续执行
      continue-on-error: true
      # 数据脚本位置（如需要）
      # data-locations: classpath*:db/*.db
      # 初始化模式（always-总是执行，embedded-仅嵌入式数据库，never-从不）
      mode: always

# ===========================================
# 日志配置
# ===========================================
logging:
  level:
    # Mapper接口日志级别
    com.chua.starter.admin.support.mapper: debug

# ===========================================
# OAuth认证配置
# ===========================================
plugin:
  oauth:
    # 开启OAuth认证
    enable: true
    # 认证服务器地址
    address: http://172.16.3.66:19180/oauth
    # 认证协议（http/http-lite/static）
    protocol: static
