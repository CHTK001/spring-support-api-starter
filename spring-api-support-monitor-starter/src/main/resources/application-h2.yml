spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/monitor;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 10000
  sql:
    init:
      enabled: true
      continue-on-error: true
      mode: always
      schema-locations: classpath:db/init/V1.0__init_monitor_complete.sql

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      connect-timeout: 3000
      timeout: 3000

plugin:
  datasource:
    script:
      enable: false
  redis:
    server:
      enable: false
  oauth:
    enable: false
  socket:
    enable: true

logging:
  level:
    com.chua.starter.monitor: debug
