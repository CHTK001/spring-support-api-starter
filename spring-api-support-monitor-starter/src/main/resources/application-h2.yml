spring:
  autoconfigure:
    exclude:
      - com.chua.starter.oauth.client.support.configuration.AuthClientConfiguration
      - com.chua.starter.project.configuration.ProjectConfiguration
      - com.chua.starter.device.configuration.DeviceConfiguration
      - com.chua.starter.server.support.config.ServerManagementConfiguration
      - com.chua.socket.support.configuration.SocketConfiguration
      - com.chua.socketio.support.configuration.SocketConfiguration
      - com.chua.starter.service.configuration.ServiceConfiguration
      - com.chua.starter.datasource.support.DataSourceInspect
      - com.chua.starter.datasource.configuration.DataSourceScriptConfiguration
      - com.chua.starter.datasource.configuration.MaterializedRouteAutoConfiguration
      - com.chua.starter.datasource.configuration.ShardingSphereAutoConfiguration
      - com.chua.starter.datasource.configuration.DataSourceTransactionConfiguration
      - com.chua.starter.datasource.support.MethodPointcutAdvisor
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/monitor;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 10000
    initialization-fail-timeout: -1
  sql:
    init:
      continue-on-error: true
      mode: always
      schema-locations: classpath:db/init/h2/V1.0__init_rag.sql

  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 3000
      timeout: 3000

plugin:
  datasource:
    script:
      enable: false
  redis:
    server:
      enable: true
      open-embedded: true
  oauth:
    enable: false
  socket:
    enable: false

logging:
  level:
    com.chua.starter.monitor: debug
