server:
  port: 31111
spring:
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/monitor?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&autoReconnect=true&allowMultiQueries=true
    username: root
    password: root

  redis:
    host: 127.0.0.1
    port: 6379
logging:
  level:
    com.chua.starter.unified.server.support.mapper: debug
plugin:
  oauth:
    address: http://127.0.0.1:19180/oauth
  table:
    enable: true
    packages: com.chua.starter.monitor.server.entity
