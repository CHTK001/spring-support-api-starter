# ===========================================
# API 业务默认启用的插件配置
# 说明：所有 starter 模块默认 enable=false，
#      在此配置文件中显式启用业务需要的模块
# ===========================================

plugin:
  # ============ 日志配置 ============
  log:
    enable: true
    open-interface-log: false

  # ============ 验证码配置 ============
  captcha:
    enable: true

  # ============ SPI 选项配置 ============
  optional:
    enable: true

  # ============ MyBatis 配置 ============
  mybatis:
    enable: true
    open-xml-reload: false

  # ============ Redis 配置 ============
  redis:
    server:
      enable: true

  # ============ API 配置 ============
  api:
    uniform: true
    version:
      enable: true
    encode:
      enable: false
    decode:
      enable: false
    spi:
      enable: true
    mock:
      enable: false
    feature:
      enable: false
    internal:
      enable: false
    deprecated:
      enable: true
    gray:
      enable: false

  # ============ OAuth 客户端配置 ============
  oauth:
    client:
      enable: true
    temp:
      open: true

  # ============ 数据源脚本配置 ============
  datasource:
    script:
      enable: false

  # ============ Job 调度配置 ============
  job:
    enable: false

  # ============ SSH 服务配置 ============
  ssh:
    server:
      enabled: false

  # ============ 同步配置 ============
  sync:
    server:
      enable: false
    client:
      enable: false
