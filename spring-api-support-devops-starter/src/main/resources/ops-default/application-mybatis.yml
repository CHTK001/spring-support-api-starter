# MyBatis 通用配置
mybatis-plus:
  global-config:
    db-config:
      # 主键ID类型
      id-type: none
      # 逻辑删除-删除值
      logic-delete-value: 1
      # 逻辑删除-未删除值
      logic-not-delete-value: 0
  configuration:
    # 枚举类型处理器
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    # 驼峰下划线转换
    map-underscore-to-camel-case: true
    # 开启二级缓存
    cache-enabled: true
  # 类型处理器包路径
  type-handlers-package: com.chua.starter.mybatis.handler

# 插件 MyBatis 扩展配置
plugin:
  mybatis:
    # 开启 XML 热加载
    open-xml-reload: true
    # 只读模式
    read-only: false
