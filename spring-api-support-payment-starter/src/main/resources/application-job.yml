plugin:
  payment:
    scheduler:
      enabled: true
      engine: job
      platform-base-url: http://127.0.0.1:18083/scheduler/api
      platform-namespace: payment
      # auto: 有 OAuth 头时走正式平台 API；简单页模式下无统一登录态时自动改走 scheduler 控制台 API。
      platform-access-mode: auto
      # 如 scheduler 控制台账号密码已改动，可在这里覆盖，供 payment 代理自动登录使用。
      # platform-console-username: admin
      # platform-console-password: admin123456
    ops:
      enabled: true
      console:
        enabled: true
        auth-enabled: true

  job:
    enable: true
    # 当前 profile 走“业务服务本地轮询 + scheduler 平台管理”模式。
    # 如果切到类似 XXL-Job 的“中心推送执行”模式，请改为:
    # config-table-enabled: false
    # remote-executor.enabled: true
    # remote-executor.access-token: job-secret
    config-table-enabled: true
    job-annotation-sync-mode: UPDATE
    scheduled-annotation-sync-mode: NONE
    table-init-mode: UPDATE
    table:
      prefix: payment
