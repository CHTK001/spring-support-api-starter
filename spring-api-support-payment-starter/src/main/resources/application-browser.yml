spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:payment_browser;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  h2:
    console:
      enabled: true

plugin:
  oauth:
    enable: false
  redis:
    server:
      enable: false
  payment:
    server:
      enable: true
    scheduler:
      enabled: true
    ops:
      enabled: true
    callback:
      base-url: http://127.0.0.1:18190/payment/api
    security:
      key: payment-browser-test-key-20260324

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.chua.payment.support: DEBUG
