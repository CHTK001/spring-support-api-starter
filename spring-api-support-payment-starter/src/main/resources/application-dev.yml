spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${PAYMENT_DATASOURCE_URL:jdbc:mysql://172.16.0.40:3306/payment_service?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false}
    username: ${PAYMENT_DATASOURCE_USERNAME:root}
    password: ${PAYMENT_DATASOURCE_PASSWORD:root}
  sql:
    init:
      mode: never

plugin:
  oauth:
    enable: false
  payment:
    server:
      enable: true
    scheduler:
      enabled: true
    ops:
      enabled: true
    callback:
      base-url: ${PAYMENT_BASE_URL:http://127.0.0.1:18190/payment/api}
    security:
      key: ${PAYMENT_SECURITY_KEY:payment-service-demo-key-20260324}

logging:
  level:
    com.chua.payment.support: INFO
