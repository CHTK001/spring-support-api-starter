spring:
  autoconfigure:
    exclude: com.chua.starter.job.support.ScheduledAutoConfiguration
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/project_test;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password:
    initialization-fail-timeout: -1
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: true
      path: /h2-console
logging:
  level:
    com.chua.starter.project: debug
server:
  port: 58080

plugin:
  datasource:
    script:
      scan-mode: ALWAYS
      data-scan-mode: ALWAYS
  redis:
    server:
      enable: false
  oauth:
    enable: false
  socket:
    enable: true
    room:
      - client-id: project
        port: 58082
        context-path: /socket.io
