spring:
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - com.chua.starter.redis.support.RedisConfiguration
      - com.chua.starter.redis.support.CacheConfiguration
      - com.chua.starter.redis.support.LockTemplateConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - com.baomidou.lock.spring.boot.autoconfigure.RedisTemplateLockAutoConfiguration
      - com.baomidou.lock.spring.boot.autoconfigure.LockAutoConfiguration
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: ${SPIDER_TEST_DATASOURCE_URL:jdbc:mysql://127.0.0.1:13306/system?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&serverTimezone=Asia/Shanghai&connectTimeout=5000&socketTimeout=30000}
    username: root
    password: root@
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 60000
      max-lifetime: 300000
  data:
    redis:
      database: 6
      host: 127.0.0.1
      port: 6379

plugin:
  oauth:
    enable: false
  ai:
    protocol-server:
      enabled: false
  redis:
    server:
      enable: false
  job:
    enable: false
  datasource:
    script:
      enable: true
      script-path: file:./db/init/*.sql,classpath*:db/init/*.sql
      scan-mode: ALWAYS
      migration-scan-mode: ALWAYS
      data-scan-mode: NONE
      continue-on-error: false
      validate-checksum: false
  spider:
    enable: true
  monitor:
    spider:
      web-auth:
        mode: none

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.chua.starter.spider: debug
    org.springframework.jdbc.core: debug
