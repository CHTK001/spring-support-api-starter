spring:
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - com.chua.starter.redis.support.RedisConfiguration
      - com.chua.starter.redis.support.CacheConfiguration
      - com.chua.starter.redis.support.LockTemplateConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - com.baomidou.lock.spring.boot.autoconfigure.RedisTemplateLockAutoConfiguration
      - com.baomidou.lock.spring.boot.autoconfigure.LockAutoConfiguration
      - com.chua.starter.licence.support.H2LicenceAutoConfiguration
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/spider_test;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    initialization-fail-timeout: -1
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 5000
      idle-timeout: 60000
      max-lifetime: 300000
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: true
      path: /h2-console

plugin:
  oauth:
    enable: false
  ai:
    protocol-server:
      enabled: false
  redis:
    server:
      enable: false
  job:
    enable: false
  datasource:
    script:
      enable: true
      script-path: file:./db/init/*.sql,classpath*:db/init/*.sql
      scan-mode: ALWAYS
      migration-scan-mode: NONE
      data-scan-mode: NONE
      continue-on-error: false
      validate-checksum: false
  spider:
    enable: true
  monitor:
    spider:
      web-auth:
        mode: none

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.chua.starter.spider: debug
    org.springframework.jdbc.core: debug
