spring:
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - com.chua.starter.redis.support.RedisConfiguration
      - com.chua.starter.redis.support.CacheConfiguration
      - com.chua.starter.redis.support.LockTemplateConfiguration
  datasource:
    driverClassName: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:mysql://172.16.0.40:3306/system?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: root@
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 60000
      max-lifetime: 300000
  data:
    redis:
      database: 6
      host: 172.16.0.40
      port: 6379

plugin:
  oauth:
    enable: false
  datasource:
    script:
      enable: true
      scan-mode: ALWAYS
      validate-checksum: false
  spider:
    enable: true
    browser:
      webmcp: true
  monitor:
    spider:
      web-auth:
        mode: none

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

spider:
  browser:
    webmcp: true

logging:
  level:
    com.chua.starter.spider: debug
