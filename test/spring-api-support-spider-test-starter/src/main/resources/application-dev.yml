spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    driverClassName: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:mysql://8.139.4.229:3306/system?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: root@
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 5000
      idle-timeout: 60000
      max-lifetime: 300000
  data:
    redis:
      database: 6
      host: 127.0.0.1
      port: 16379

plugin:
  oauth:
    enable: false
  datasource:
    script:
      enable: true
      scan-mode: ALWAYS
  spider:
    enable: true
  monitor:
    spider:
      web-auth:
        mode: none

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.chua.starter.spider: debug
