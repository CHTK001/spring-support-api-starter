spring:
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - com.chua.starter.redis.support.RedisConfiguration
      - com.chua.starter.redis.support.CacheConfiguration
      - com.chua.starter.redis.support.LockTemplateConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - com.baomidou.lock.spring.boot.autoconfigure.RedisTemplateLockAutoConfiguration
      - com.baomidou.lock.spring.boot.autoconfigure.LockAutoConfiguration
      - com.chua.starter.licence.support.H2LicenceAutoConfiguration
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.16.0.40:3306/system?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: root@
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 5000
      connection-test-query: SELECT 1
  data:
    redis:
      database: 6
      host: 172.16.0.40
      port: 6379

plugin:
  oauth:
    enable: false
  datasource:
    script:
      enable: true
      scan-mode: ALWAYS
      validate-checksum: false
  spider:
    enable: true
    browser:
      webmcp: true
  monitor:
    spider:
      web-auth:
        mode: none

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

spider:
  browser:
    webmcp: true

logging:
  level:
    com.chua.starter.spider: debug
