server:
  port: 58083

spring:
  application:
    name: workflow-test
  datasource:
    url: jdbc:h2:mem:workflow_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      schema-locations: classpath:schema.sql
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

plugin:
  oauth:
    enable: false
  security:
    exclude-paths: /v2/user/**,/v2/workflow/**

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
