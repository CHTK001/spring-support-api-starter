spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.16.0.40:3306/ai_test?useSSL=false&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&socketTimeout=5000&connectTimeout=3000
    username: root
    password: root@
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 20
      validation-timeout: 3000
      leak-detection-threshold: 30000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql,classpath*:db/init/V1.0__init_spider.sql,classpath:spider-fix.sql
      continue-on-error: true

logging:
  level:
    com.chua.starter.project: debug
    com.chua.starter.ai: debug
    com.chua.starter.panel: debug
    com.chua.starter.mybatis: debug
    com.baomidou.mybatisplus: debug

docker:
  api:
    host: 172.16.0.40
    port: 2375

app:
  rag:
    enabled: true
    embedding-engine: onnx
    vector-storage: jvector
    default-similarity-threshold: 0.1
    upload-dir: ./data/rag-test/uploads
    use-graph: true
    graph-max-hops: 2
    graph-max-tokens: 1000
    # LLM 配置已移除，直接使用全局 LLM 配置 (sys_ai_global_setting runtime 组)
