spring:
  application:
    name: ai-test
  autoconfigure:
    exclude:
      - com.chua.starter.project.configuration.ProjectConfiguration
  profiles:
    active: dev

server:
  port: 8085

plugin:
  redis:
    server:
      enable: false
  oauth:
    enable: false
  datasource:
    script:
      enable: true
      script-path: classpath*:db/init/*.sql
      scan-mode: ONCE
      migration-scan-mode: ALWAYS
      data-scan-mode: ONCE
      continue-on-error: false
      validate-checksum: false
