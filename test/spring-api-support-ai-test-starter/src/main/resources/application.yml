spring:
  application:
    name: ai-test
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: dev
  autoconfigure:
    exclude:
      - com.chua.starter.oauth.client.support.configuration.AuthClientConfiguration

server:
  port: 58084

plugin:
  redis:
    server:
      enable: false
  oauth:
    enable: false
    protocol: static
    temp:
      open: false
    whitelist:
      - /v2/**
  captcha:
    enable: true
  ai:
    protocol-server:
      enabled: false
      port: 58085
  datasource:
    script:
      enable: true
      script-path: classpath*:db/init/*.sql
      scan-mode: ONCE
      migration-scan-mode: ALWAYS
      data-scan-mode: ONCE
      continue-on-error: false
      validate-checksum: false
