spring:
  application:
    name: payment-test
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: dev
    include: common,mybatis,swagger,api,actuator
  autoconfigure:
    exclude:
      - com.chua.starter.ai.support.configuration.AiConfiguration
      - com.chua.starter.ai.support.configuration.AiCacheKeyGeneratorAliasConfiguration
      - com.chua.starter.ai.support.configuration.AiCacheManagerFallbackConfiguration

server:
  port: 8085
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        exclude: mybatis-extension

plugin:
  strategy:
    circuit-breaker:
      enabled: false
  payment:
    server:
      enable: true
    scheduler:
      enabled: false
    ops:
      enabled: true
    callback:
      base-url: http://127.0.0.1:8085/api
    security:
      key: payment-test-key-20260324
  oauth:
    enable: false
  ai:
    enable: false
  server:
    enable: false
  redis:
    server:
      enable: false
  datasource:
    script:
      enable: true
      script-path: classpath*:db/init/*.sql,classpath*:db/migration/*.sql,classpath*:db/sync/*.sql
      scan-mode: ONCE
      migration-scan-mode: ALWAYS
      data-scan-mode: ONCE
      continue-on-error: true
