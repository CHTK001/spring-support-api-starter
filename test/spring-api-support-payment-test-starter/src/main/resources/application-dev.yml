spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.16.0.40:3306/payment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&autoReconnect=true&failOverReadOnly=false
    username: root
    password: root@
  data:
    redis:
      host: 172.16.0.40
      port: 6379

logging:
  file:
    name: ./logs/payment-test.log
  level:
    com.chua.payment.support: DEBUG
    com.chua.starter.payment: DEBUG
    org.springframework.web: DEBUG

plugin:
  strategy:
    idempotent:
      enabled: true
      type: redis
    sql-injection:
      enabled: false
  payment:
    provider:
      wechat-spi: default
      alipay-spi: default
