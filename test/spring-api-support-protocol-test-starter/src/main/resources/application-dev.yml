spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:protocol_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

logging:
  level:
    com.chua.starter.protocol: debug
    com.chua.starter.proxy: debug
