# 数据源与联调环境与 spring-api-support-system-starter 对齐（具体库名/主机可按环境修改）
spring:
  datasource:
    driverClassName: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:mysql://172.16.0.40:3306/system?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root@
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 5000
      idle-timeout: 60000
      max-lifetime: 300000

# spring-support-datasource-starter 由 protocol → mybatis-starter 传递引入；脚本扫描 classpath*:db/init/*.sql
plugin:
  datasource:
    script:
      enable: true
      scan-mode: ALWAYS

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.chua.starter.protocol: debug
