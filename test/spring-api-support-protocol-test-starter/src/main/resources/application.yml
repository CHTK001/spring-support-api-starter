spring:
  application:
    name: protocol-test
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
      - com.chua.starter.server.support.config.ServerManagementConfiguration
      - com.chua.starter.datasource.configuration.DataSourceScriptConfiguration
      - com.chua.starter.ai.support.configuration.AiProtocolServerConfiguration

server:
  port: 19181

mybatis-plus:
  encryptor:
    password: 1234567890123456

plugin:
  protocol:
    enable: false
  proxy:
    auto-restart-running: false
    crypto-secret-key: dev-proxy-test-key
  oauth:
    enable: false
  datasource:
    script:
      enable: false
