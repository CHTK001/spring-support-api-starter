server:
  port: 19092

spring:
  application:
    name: video-test
  datasource:
    url: jdbc:h2:mem:video_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 2
  sql:
    init:
      mode: never
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  # 关闭 SQL 初始化，因为我们只需要 direct provider 测试
  mapper-locations: classpath*:/mapper/**/*.xml

logging:
  level:
    com.chua.starter.video: debug
