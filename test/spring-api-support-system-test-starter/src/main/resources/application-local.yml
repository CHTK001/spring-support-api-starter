spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.16.0.40:3306/system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&connectTimeout=5000&socketTimeout=30000
    username: root
    password: root@
    initialization-fail-timeout: -1
  data:
    redis:
      host: 172.16.0.40
      port: 6379
  sql:
    init:
      mode: never
logging:
  level:
    com.chua.starter.system.mapper: debug

plugin:
  datasource:
    script:
      enable: true
  redis:
    server:
      enable: false
  system:
    server:
      enable: true
    feedback:
      menu:
        enabled: false
  oauth:
    enable: false
  job:
    enable: true
soft:
  management:
    enable: true
