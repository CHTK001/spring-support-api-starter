spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:panel_test;MODE=MySQL;NON_KEYWORDS=IF;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

logging:
  level:
    com.chua.starter.panel: debug
    com.chua.starter.project: debug
