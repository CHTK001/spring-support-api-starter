spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.16.0.40:3306/panel_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&connectTimeout=5000&socketTimeout=30000
    username: root
    password: root@
    initialization-fail-timeout: -1
  sql:
    init:
      mode: never
server:
  port: 18866
panel:
  enabled: true
  jdbc-enabled: true
  ai-enabled: false
  datasource-store-path: ${user.dir}/.panel/panel-datasources.json

plugin:
  datasource:
    script:
      scan-mode: ALWAYS
      data-scan-mode: ALWAYS
  redis:
    server:
      enable: false
  oauth:
    enable: false
  job:
    enable: true
  socket:
    enable: true
    room:
      - client-id: panel
        port: 58083
        context-path: /socket.io

docker:
  api:
    host: 172.16.0.40
    port: 2375
