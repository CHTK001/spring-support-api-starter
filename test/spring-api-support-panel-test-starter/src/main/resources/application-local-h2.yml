spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/panel_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    initialization-fail-timeout: -1
  data:
    redis:
      host: 172.16.0.40
      port: 6379
  sql:
    init:
      mode: always
      schema-locations: classpath:db/init/V1.0__init_panel.sql
      data-locations: classpath:db/init/V1.0__initdata_panel.sql
  h2:
    console:
      enabled: true
      path: /h2-console
logging:
  level:
    com.chua.starter.panel: debug
    com.chua.starter.project: debug
server:
  port: 58081
panel:
  enabled: true
  jdbc-enabled: true
  ai-enabled: false
  datasource-store-path: ${user.dir}/.panel/panel-datasources.json

docker:
  api:
    host: 172.16.0.40
    port: 2375

plugin:
  oauth:
    enable: false
  socket:
    enable: true
    room:
      - client-id: panel
        port: 58082
        context-path: /socket.io
