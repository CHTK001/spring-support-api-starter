spring:
  application:
    name: job-nacos-executor
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/job-executor-db;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:

server:
  port: 18081
  servlet:
    context-path: /payment/api

plugin:
  discovery:
    enable: true
    properties:
      - protocol: nacos
        address: 172.16.0.40:8848
        node:
          - server-id: ${spring.application.name}
            namespace: /job-executor/payment
            protocol: http
  job:
    enable: true
    config-table-enabled: false
    table-init-mode: DROP_CREATE
    job-annotation-sync-mode: NONE
    scheduled-annotation-sync-mode: NONE
    remote-executor:
      enabled: true
      access-token: job-secret
      dispatch-path: /v1/job-executor/dispatch
    table:
      prefix: payment
