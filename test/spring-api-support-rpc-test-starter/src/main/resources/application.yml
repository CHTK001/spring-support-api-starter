server:
  port: 18080

spring:
  application:
    name: rpc-test-app
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration

# RPC 配置
plugin:
  rpc:
    enable: true
    # DUBBO / SOFA / JSON 三种协议可选
    type: SOFA
    application-name: rpc-test-app
    # 注册中心：multicast 无需外部服务，适合本机测试
    registry:
      - address: 224.5.6.7:1234
        protocol: multicast
        timeout: 5000
        check: false
        parameters:
          register-mode: interface
    # 协议配置
    protocols:
      - name: sofa
        host: 0.0.0.0
        port: 12200
    # 消费者配置
    consumer:
      timeout: 5000
      retries: 1
      check: false

