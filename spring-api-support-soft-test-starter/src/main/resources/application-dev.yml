spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SOFT_TEST_DATASOURCE_URL:jdbc:mysql://172.16.0.40:3306/soft_test?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${SOFT_TEST_DATASOURCE_USERNAME:root}
    password: ${SOFT_TEST_DATASOURCE_PASSWORD:root@}
    hikari:
      pool-name: SoftTestHikariPool
      minimum-idle: 1
      maximum-pool-size: 6
      connection-timeout: 5000
      idle-timeout: 60000
      max-lifetime: 300000
      connection-test-query: SELECT 1
  sql:
    init:
      mode: never

mybatis-plus:
  encryptor:
    mode: ${SOFT_TEST_MYBATIS_ENCRYPTOR_MODE:auto}
    password: ${SOFT_TEST_MYBATIS_ENCRYPTOR_PASSWORD:softkey123456789}

logging:
  level:
    com.chua.starter.soft.support.mapper: debug

soft:
