    bootstrap:
      enabled: ${SOFT_TEST_BOOTSTRAP_ENABLED:true}
      reset-state: ${SOFT_TEST_BOOTSTRAP_RESET_STATE:true}
    local:
      username: ${SOFT_TEST_LOCAL_USERNAME:yemen}
      base-directory: ${SOFT_TEST_LOCAL_BASE_DIRECTORY:H:/workspace/2/tmp/soft-runtime/local}
    remote:
      host: ${SOFT_TEST_REMOTE_HOST:8.139.4.229}
      port: ${SOFT_TEST_REMOTE_PORT:22}
      username: ${SOFT_TEST_REMOTE_USERNAME:root}
      password: "${SOFT_TEST_REMOTE_PASSWORD:Yaq.K11qiRenWen>a<6XsJlbEN}"
