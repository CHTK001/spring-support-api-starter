spring:
  application:
    name: soft-test
  profiles:
    active: dev
    include: common,mybatis,swagger,api,actuator

server:
  port: 18171
  servlet:
    context-path: /soft-test/api

management:
  endpoints:
    web:
      exposure:
        exclude: mybatis-extension

plugin:
  server:
    enable: true
    remote-gateway:
      enable: true
      default-provider: ${SOFT_TEST_REMOTE_GATEWAY_PROVIDER:guacamole}
    guacamole:
      enable: true
      gateway-url: ${SOFT_TEST_GUACAMOLE_GATEWAY_URL:http://172.16.0.40:18088/guacamole}
      auth-mode: ${SOFT_TEST_GUACAMOLE_AUTH_MODE:json}
      json-secret-key: ${SOFT_TEST_GUACAMOLE_JSON_SECRET_KEY:7a4b42e80d68305bb13f2b0be3b4b0d1}
      default-linux-protocol: ssh
      default-windows-protocol: rdp
    metrics:
      enable: true
      cache-enabled: true
  soft:
    server:
      enable: true
  oauth:
    enable: false
  socket:
    enable: true
    protocol: socketio
    host: 0.0.0.0
    codec-type: sm2
    encrypt-mode: auto
    encrypt-enabled: true
    room:
      - client-id: default
        port: 29191
        context-path: /socket.io
  redis:
    server:
      enable: true
      open-embedded: true
      host: 127.0.0.1
      port: 6379
  datasource:
    script:
      enable: true
      script-path: classpath*:db/init/*.sql
      scan-mode: ONCE
      migration-scan-mode: ALWAYS
      data-scan-mode: NONE
      continue-on-error: false
