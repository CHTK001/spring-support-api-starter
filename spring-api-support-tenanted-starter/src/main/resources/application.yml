spring:
  application:
    name: tenant
  profiles:
    active: dev
    include: mybatis,swagger,socket,control,codec,ip,discovery,tenant

server:
  port: 18171
  servlet:
    context-path: /tenant/api
  http2:
    enabled: true

# ===========================================
# 插件启用配置
# ===========================================
plugin:
  cors:
    enable: true
  log:
    enable: true
  captcha:
    enable: true
  optional:
    enable: true
  mybatis:
    enable: true
  redis:
    server:
      enable: true
  oauth:
    client:
      enable: true
    temp:
      open: true
  api:
    uniform: true
    version:
      enable: true
    spi:
      enable: true
    deprecated:
      enable: true
