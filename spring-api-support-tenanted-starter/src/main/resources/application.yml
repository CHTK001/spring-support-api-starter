spring:
  application:
    name: tenant
  profiles:
    active: dev
    include: mybatis,swagger,socket,control,codec,api,ip,discovery,tenant

server:
  port: 18172
  servlet:
    context-path: /tenant/api
  http2:
    enabled: true

# ===========================================
# 插件启用配置
# ===========================================
plugin:
  cors:
    enable: true
  # 本模块只引入 socket-io starter，而协议默认值为 sse，不改写会因缺少 sse SPI 实现启动失败
  socket:
    protocol: socketio
  log:
    enable: true
  captcha:
    enable: true
  optional:
    enable: true
  mybatis:
    enable: true
  redis:
    server:
      enable: true
  oauth:
    client:
      enable: true
    temp:
      open: true
  api:
    uniform: true
    version:
      enable: true
    spi:
      enable: true
    deprecated:
      enable: true
