spring:
  datasource:
    driverClassName: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:mysql://127.0.0.1:3306/system?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=false&serverTimezone=Asia/Shanghai
    username: system
    password: system123
  data:
    redis:
      database: 6
      host: 127.0.0.1
      port: 6379
  # 建表与种子数据统一走 datasource-starter 的 FlywayLike 机制
  # （plugin.datasource.script），这里关掉 Spring 自带的 schema/data 初始化，
  # 避免两套建表逻辑打架 —— FlywayLike 会自动扫描 classpath*:db/init/*.sql，
  # 各模块 jar 里的脚本一并纳入，无需逐个列举 schema-locations。
  sql:
    init:
      mode: never
logging:
  level:
    com.chua.starter.tenant.server.mapper: debug


plugin:
  control:
    platform:
      name: tenant
  datasource:
    script:
      # 建表与种子数据统一走 FlywayLike（扫 classpath*:db/init/*.sql）
      enable: true
      scan-mode: ALWAYS
      data-scan-mode: ONCE
      continue-on-error: true
  mybatis-plus:
    tenant:
      enable: true
  table:
    packages: com.chua.starter.admin.entity
    enable: true
  oauth:
    address: http://localhost:19180/oauth
    protocol: http-lite