# 租户模块配置
plugin:
  mybatis-plus:
    tenant:
      # 客户端配置
      client:
        # 是否启用客户端模式
        enable: true
        # 租户ID字段名
        tenant-id-column: sys_tenant_id
        # 是否自动添加租户字段（生产环境请设置为false）
        auto-add-column: false
        # 是否启用同步接收
        sync-enable: true
        # 通信协议: rsocket, websocket
        protocol: rsocket
        # 服务端地址
        server-host: localhost
        # 服务端端口
        server-port: 19380
