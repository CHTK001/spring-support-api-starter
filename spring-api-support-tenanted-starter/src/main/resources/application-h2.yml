spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:TENANTED;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  h2:
    console:
      enabled: true
  sql:
    init:
      mode: never
plugin:
  datasource:
    script:
      enable: false
  redis:
    server:
      enable: false
  job:
    enable: false
  sync:
    client:
      enable: false
  user-agreement:
    enable: false
  system:
    feedback:
      menu:
        enabled: false
