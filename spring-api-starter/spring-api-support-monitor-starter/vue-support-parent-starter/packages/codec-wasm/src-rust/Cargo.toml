[package]
name = "codec-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4"
md-5 = "0.10"
sm3 = "0.2"
sm4 = "0.2"
libsm = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3"
aes = "0.7"
block-modes = "0.7"