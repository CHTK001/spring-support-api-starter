# ===========================================
# 应用程序基础配置
# ===========================================
spring:
  main:
    web-application-type: servlet  # 应用类型：Web（提供认证协议 HTTP 入口）
    allow-bean-definition-overriding: true
    allow-circular-references: true   # 允许循环引用（历史遗留的 ServiceImpl 自注入模式）
  autoconfigure:
    exclude:
      - com.chua.starter.common.support.configuration.AsyncThreadPoolConfiguration  # 排除冲突的 AsyncConfigurer（与 Spring Boot 默认异步配置重复注册）
  profiles:
    # 默认走 prod，而不是 dev。
    # 原先默认 ${SPRING_PROFILES_ACTIVE:dev}：部署方一旦忘了注入环境变量，就静默落到
    # dev 配置（日志更啰嗦、开关更宽松），而且**看不出任何异常**——「忘了配环境变量」
    # 这种最常见的部署失误，反而变成了最容易上线的那个。
    # 改成 prod 后，同样情况会在启动阶段直接失败（application-prod.yml 的
    # ${OAUTH_DB_PASSWORD} 无默认值，解析不到即抛 Could not resolve placeholder），
    # 把「上线即裸奔」变成「上线即报错」。
    # 本地调试请显式指定：SPRING_PROFILES_ACTIVE=dev java -jar ...
    active: ${SPRING_PROFILES_ACTIVE:prod}
    include: plugin,mybatis,socket,report,api,ip,actuator  # 引入的公共配置模块
  application:
    name: oss                    # 应用名称（OAuth 认证服务）
  cache:
    type: none                   # 禁用缓存，避免 Redis 缓存 Bean 冲突

 # ===========================================
 # 服务器配置
 # ===========================================
server:
  port: 19181                    # 认证协议 HTTP 服务端口
  servlet:
    context-path: /oauth         # 上下文路径

logging:
  level:
    # armeria 已于 2026-09-29 移除，原先在此压制其 HttpServerHandler 的日志

plugin:
  api:
    platform:
      name: OAUTH
