spring:
  datasource:
    driverClassName: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:mysql://172.16.0.40:3306/system?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 口令不给默认值：写进仓库就不再是秘密；生产必须注入 OAUTH_DB_PASSWORD，
    # 未注入时 Spring 会抛 Could not resolve placeholder 直接启动失败。
    password: ${OAUTH_DB_PASSWORD}

  data:
    redis:
      port: 6379
      host: 172.16.0.40
      database: 15
logging:
  level:
    com.chua.starter.oauth.sso: debug