spring:
  # 主数据源：本服务自己的库（sys_user / sys_role / 令牌等）
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${OAUTH_DB_HOST:127.0.0.1}:${OAUTH_DB_PORT:3307}/oauth?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${OAUTH_DB_USER:eduai}
    password: ${OAUTH_DB_PASSWORD:eduai123}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 15

# ===========================================
# OAuth 服务端配置
# ===========================================
plugin:
  api:
    # TCP 协议链路不启用加密。
    # 关键事实：是否加密由请求头 x-oauth-encode 决定（OauthProtocolDecoder 第 98 行，
    # 缺省 false），HttpProtocol/RSocketProtocol 会显式带该头，
    # 而 TcpProtocol 不带 —— 故 TCP 链路天然是明文。
    # 这里必须保持 false：置 true 会让 writeResult 按加密回包，
    # 而 TcpProtocol 直接把响应体当 JSON 解析（不做解密），
    # 实测报 JsonParseException。
    encode:
      enable: false
  datasource:
    script:
      enable: false
      continue-on-error: true
  # 学生登录用的跨库通道：edu_student 在 eduai 库，与本服务主库不同。
  # 不并入主数据源的原因：两库表结构已各自演进（sys_setting 列已分叉），
  # 合并有真实数据风险；独立数据源语义最直白，且不把这张表带进主库的 MyBatis 映射。
  edu-auth:
    datasource:
      driver-class-name: com.mysql.cj.jdbc.Driver
      # 键名必须是 jdbc-url 而非 url：@ConfigurationProperties 直接绑定到
      # HikariDataSource 的属性名（HikariConfig#jdbcUrl），写 url 绑不上，
      # 启动后首次取连接会报「jdbcUrl is required with driverClassName」。
      # Spring Boot 自己的 spring.datasource.url 能用 url，是因为中间隔了一层
      # DataSourceProperties 做映射，本处没有那一层。
      jdbc-url: jdbc:mysql://${EDUAI_DB_HOST:127.0.0.1}:${EDUAI_DB_PORT:3307}/eduai?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      username: ${EDUAI_DB_USER:eduai}
      password: ${EDUAI_DB_PASSWORD:eduai123}
  oauth:
    whitelist:
      - /**/login
      - /**/logout
      - /**/upgrade
      - /**/temporary-token
      - /**/verify
      - /**/oauth
    server:
      # 签名校验开关（默认 true，生产环境必须开启）
      # 关闭后跳过 x-oauth-sign 验证，仅用于调试
      sign-verify: false
      # JWT 配置
      jwt:
        enabled: true
        algorithm: HS256
        secret: oauth-server-jwt-secret-key-256bit
        issuer: oauth-server
        expire-seconds: 3600
        jwks-enabled: true
      # 令牌过期时间（秒），默认 30 天（一个月）
      expire: 2592000
      # 刷新令牌过期时间（秒），默认 40 天
      refresh-expire: 3456000
      # 令牌自动续期（每次鉴权成功后重置过期时间）
      renew: false
      # 用户在线模式：SINGLE / MULTIPLE / LIMIT
      online: SINGLE
      # 是否开启 AK/SK 校验
      open-check-ak-sk: false
      # 多协议认证 Server(基于 common-starter network.Server,与 client 端协议一一对应)
      # - tcp      : 默认协议(19180 认证入口)。type=aio-tcp 对应 AioTcpServer 的 SPI 名,
      #               protocol=tcp 决定传输与帧格式(topic:body,如 login:{...});
      #               OauthProtocolServerManager 对实现了 TcpServer 的实例会走专门的帧解析分支。
      # - http     : jdk 实现(JdkHttpServer @Spi("jdk"))
      # - rsocket  : rsocket 实现(对应 client RSocketProtocol)
      # armeria 已于 2026-09-29 移除(对应 client ArmeriaProtocol 与服务端
      # ArmeriaOauthProtocol 一并退役)，原先占用的 19184 端口不再监听
    protocol-server:
      protocols:
        - name: tcp
          type: aio-tcp
          protocol: tcp
          host: 0.0.0.0
          port: 19180
          enable: true
          context-path: /
        - name: http
          type: jdk
          protocol: http
          host: 0.0.0.0
          port: 19182
          enable: true
          context-path: /
        - name: rsocket
          type: rsocket
          protocol: rsocket
          host: 0.0.0.0
          port: 19185
          enable: true
          context-path: /
        - name: kcp
          type: kcp
          protocol: kcp
          host: 0.0.0.0
          port: 19186
          enable: true
          context-path: /
  mybatis-plus:
    encryptor:
      password: oauth-encrypt-key

soft:
  management:
    enable: false

logging:
  level:
    org.mybatis: debug
    com.baomidou.mybatisplus: debug
    com.chua.starter.oauth.sso: INFO
    com.chua.starter.oauth.sso.support.information.BaseAuthInformation: WARN

# ===========================================
# Actuator 暴露面（安全收紧）
# ===========================================
# 背景：框架的 DatabaseSettingEnvironmentPostProcessor 会把
# management.endpoints.web.exposure.include 作为「启动期默认设置」种进 sys_setting，
# 默认值是 "*" —— 即 env / beans / configprops / loggers / threaddump / mappings
# 全部无鉴权对外暴露。其中 /actuator/loggers 允许 POST 修改运行期日志级别，
# 可被用来刷 DEBUG 打满磁盘或关闭安全日志，属真实攻击面。
#
# 为什么必须在这里（而不是只改库）：本服务没有启用客户端的 AuthFilter
# （它是认证服务端，不是被保护方），无法靠「白名单外即需鉴权」兜底，
# 只能从暴露面上收紧。实测 yml 优先级高于该 DB 属性源，故此处显式收窄。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # 不对外暴露组件明细（DB / 磁盘等），避免信息泄露
      show-details: never
