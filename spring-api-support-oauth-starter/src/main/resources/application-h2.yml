spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:oauth;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  h2:
    console:
      enabled: true
plugin:
  datasource:
    script:
      scan-mode: NONE
  redis:
    server:
      enable: false
  oauth:
    client:
      enable: false
  user-agreement:
    enable: false
  system:
    feedback:
      menu:
        enable: false
