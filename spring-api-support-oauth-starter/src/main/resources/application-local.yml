spring:
  datasource:
    url: jdbc:p6spy:mysql://127.0.0.1:3306/system?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 本地开发默认不再写死口令：留空默认，需要时设 OAUTH_DB_PASSWORD
    # （此前是 root@，等同于把本地库口令公开在仓库里）。
    password: ${OAUTH_DB_PASSWORD:}
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      database: 15
  autoconfigure:
    exclude:
      - com.chua.starter.ai.support.configuration.RagAutoConfiguration
      - com.chua.starter.ai.support.configuration.AiConfiguration
      - com.chua.starter.ai.support.configuration.AiProtocolServerConfiguration
      - com.chua.starter.ai.support.configuration.AiCacheKeyGeneratorAliasConfiguration
      - com.chua.starter.ai.support.configuration.AiCacheManagerFallbackConfiguration
