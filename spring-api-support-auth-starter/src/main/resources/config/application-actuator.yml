# ===========================================
# Spring Boot Actuator监控端点配置
# ===========================================
management:
  endpoints:
    web:
      exposure:
        # 暴露的端点（*表示全部）
        include: "*"
      # 端点基础路径
      base-path: /actuator
  endpoint:
    health:
      # 显示健康检查详情
      show-details: always
    # 其他端点配置示例：
    # shutdown:
    #   enabled: false    # 关闭shutdown端点
  # 健康检查配置
  health:
    # 禁用数据库健康检查(避免使用错误的数据源配置)
    db:
      enabled: false
